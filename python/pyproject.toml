[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kapwa-design-system"
version = "1.0.0"
authors = [
  { name="Brian Ragaza", email="ragazabrian@users.noreply.github.com" },
]
description = "Kapwa Design System - Multi-platform Design System (HTML, CSS, JS, Python) for Web, Mobile, and Desktop"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: User Interfaces",
]

[project.scripts]
kapwa = "kapwa.server:run_server"
kapwa-desktop = "kapwa.desktop_app:main"
